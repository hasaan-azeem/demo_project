<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AidBloom - Signup</title>
    
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="./images/logo.png" type="image/x-icon">

 
    
</head>
<body>
    <header class="header">
        <nav class="navbar">
          <div class="logo-section">
            <a href="index.html"><img src="images/logo.png" alt="AidBloom Logo" class="logo"></a>
            <span class="site-name">AidBloom</span>
          </div>
          <button class="menu-toggle" aria-label="Toggle menu">☰</button>
          <ul class="nav-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="donate.html">Donate</a></li>
            <li><a href="index.html#contact">Contact</a></li>
            <li><a href="index.html#aboutus">About Us</a></li>
            <li>
              <a href="login.html" class="register-btn">Login</a>
            </li>
          </ul>
        
        </nav>
        
      </header>

      <form class="form">
        <p class="title">Register</p>
        <p class="message">Signup now and get full access to our app.</p>

        <div class="flex">
            <label>
                <input class="input" type="text" required placeholder="First name">
                <!-- <span>Firstname</span> -->
            </label>

            <label>
                <input class="input" type="text" required placeholder="Last name">
                <!-- <span>Lastname</span> -->
            </label>
        </div>  

        <label>
            <input class="input" type="email" required placeholder="Email">
            <!-- <span>Email</span> -->
        </label> 

        <label>
            <input class="input" type="password" required placeholder="Password">
            <!-- <span>Password</span> -->
        </label>

        <label>
            <input class="input" type="password" required placeholder="Confirm password">
            <!-- <span>Confirm password</span> -->
        </label>

        <button class="submit">Submit</button>

        <p class="or-text">or</p>

        <div class="social-login">
            <button class="social-btn google">Login with Google</button>
            <button class="social-btn facebook">Login with Facebook</button>
        </div>

        <p class="signin">Already have an account? <a href="login.html">Signin</a></p>
    </form>
      


      <footer class="footer">
        <div class="containor">
          <div class="footer-content">
            <div class="footer-logo">
              <img src="images/logo.png" alt="AidBloom Logo" class="footer-logo-img">
              <span class="footer-site-name">AidBloom</span>
            </div>
      
            <div class="footer-links">
              <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="donate.html">Donate</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="index.html#about">About Us</a></li>
              </ul>
            </div>
      
            <div class="footer-contact">
              <p>Contact Us:</p>
              <a href="mailto:info@aidbloom.com" class="footer-email">info@aidbloom.com</a>
            </div>
          </div>
      
          <div class="footer-bottom">
            <p>&copy; 2025 AidBloom. All rights reserved.</p>
          </div>
        </div>
      </footer>
      <script src="https://kit.fontawesome.com/a076d05399.js"></script>
  
  
      <script src="script.js"></script>
</body>
</html>
